name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake grid animations
        uses: Platane/snk@v3
        id: snake-grid
        with:
          github_user_name: sheinafathurr1
          outputs: |
            dist/snake-light.svg?color_snake=%231a1a1a&color_dots=%23ebedf0,%23c4c4c4,%238c8c8c,%23545454,%231a1a1a
            dist/snake-dark.svg?color_snake=%23ffffff&color_dots=%23161b22,%233f3f3f,%236e6e6e,%23a8a8a8,%23ffffff

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
